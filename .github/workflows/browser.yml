name: Browser checks
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install test browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test desktop and mobile workflows
        run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
